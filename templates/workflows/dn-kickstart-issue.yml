name: dn kickstart issue

on:
  repository_dispatch:
    types: [dn.kickstart_issue]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  kickstart-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Run dn kickstart
        uses: chesapeakedev/dn-action@v1
        with:
          workflow: dn.kickstart_issue
          validate-only: ${{ github.event.client_payload.validate_only == true }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          IS_OPEN_SOURCE: "true"
          NO_COLOR: "1"
