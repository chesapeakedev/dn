name: dn daily kickstart

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      milestone:
        description: "Milestone number or GitHub milestone URL"
        required: false
        type: string
      validate_only:
        description: "Validate configuration without running kickstart"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  daily-kickstart:
    runs-on: ubuntu-latest
    steps:
      - name: Run dn kickstart once
        uses: chesapeakedev/dn-action@v1
        with:
          workflow: dn.daily_kickstart
          validate-only: ${{ inputs.validate_only }}
        env:
          DN_DAILY_KICKSTART_MILESTONE: ${{ vars.DN_DAILY_KICKSTART_MILESTONE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          IS_OPEN_SOURCE: "true"
          NO_COLOR: "1"
