name: dn init stack
run-name: "dn.init_stack · ${{ github.event.client_payload.dispatch_id }}"

on:
  repository_dispatch:
    types: [dn.init_stack]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  init-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Run dn init stack
        uses: chesapeakedev/dn-action@v1
        with:
          workflow: dn.init_stack
          validate-only: ${{ github.event.client_payload.validate_only == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          NO_COLOR: "1"
