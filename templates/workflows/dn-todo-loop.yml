name: dn todo loop

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      plan_file:
        description: "Path to the todo plan file"
        required: false
        default: "plans/todo.plan.md"
        type: string
      validate_only:
        description: "Validate configuration without running loop"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

jobs:
  todo-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Run dn loop on todo plan
        uses: chesapeakedev/dn-action@v1
        with:
          workflow: dn.todo_loop
          validate-only: ${{ inputs.validate_only }}
        env:
          DN_TODO_PLAN_PATH: ${{ inputs.plan_file || 'plans/todo.plan.md' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          NO_COLOR: "1"
