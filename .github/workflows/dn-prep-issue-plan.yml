name: dn meld issue plan

on:
  repository_dispatch:
    types: [dn.meld_issue_plan, dn.prep_issue_plan]

permissions:
  contents: write
  issues: write

jobs:
  meld-issue-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Run dn meld
        uses: chesapeakedev/dn-action@v1
        with:
          workflow: ${{ github.event.action }}
          validate-only: ${{ github.event.client_payload.validate_only == true }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          NO_COLOR: "1"

      - name: Commit plan to repository
        if: ${{ ! github.event.client_payload.validate_only }}
        shell: bash
        run: |
          if [ -n "$(git status --porcelain plans/)" ]; then
            git add plans/
            git commit -m "meld: plan from ${{ github.event.action }} (${{ github.event.client_payload.dispatch_id }})"
            git push
          fi
