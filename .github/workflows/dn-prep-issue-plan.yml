name: dn meld issue plan
run-name: "${{ github.event.action }} · ${{ github.event.client_payload.dispatch_id }}"

on:
  repository_dispatch:
    types: [dn.meld_issue_plan, dn.prep_issue_plan]

permissions:
  contents: read
  issues: write

jobs:
  meld-issue-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Run dn meld
        uses: chesapeakedev/dn-action@v1
        with:
          workflow: ${{ github.event.action }}
          validate-only: ${{ github.event.client_payload.validate_only == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          # Approve GitHub issue meld targets while dn-action still ships
          # binaries that do not pass --yes from workflows exec.
          DN_YES: "1"
          NO_COLOR: "1"
