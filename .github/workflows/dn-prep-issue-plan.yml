name: dn prep issue plan

on:
  repository_dispatch:
    types: [dn.prep_issue_plan]

permissions:
  contents: write
  issues: write

jobs:
  prep-issue-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Validate dispatch payload
        id: payload
        uses: actions/github-script@v7
        with:
          script: |
            const payload = context.payload.client_payload || {};
            if (payload.schema_version !== "1.0") {
              core.setFailed("client_payload.schema_version must be 1.0");
              return;
            }
            if (!payload.dispatch_id) {
              core.setFailed("client_payload.dispatch_id is required");
              return;
            }
            const hasIssueUrl = Boolean(payload.issue_url);
            const hasIssueNumber = Boolean(payload.issue_number);
            if (hasIssueUrl === hasIssueNumber) {
              core.setFailed("Provide exactly one of client_payload.issue_url or client_payload.issue_number");
              return;
            }
            core.setOutput("issue", hasIssueUrl ? String(payload.issue_url) : String(payload.issue_number));
            core.setOutput("plan_name", payload.plan_name ? String(payload.plan_name) : "");
            core.setOutput("agent", payload.agent ? String(payload.agent) : "");

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dn
        id: dn-install
        uses: chesapeakedev/dn-action@v1

      - name: Run dn prep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_COLOR: "1"
        run: |
          AGENT_ARG=""
          if [ -n "${{ steps.payload.outputs.agent }}" ]; then
            AGENT_ARG="--agent ${{ steps.payload.outputs.agent }}"
          fi

          PLAN_ARG=""
          if [ -n "${{ steps.payload.outputs.plan_name }}" ]; then
            PLAN_ARG="--plan-name ${{ steps.payload.outputs.plan_name }}"
          fi

          "${{ steps.dn-install.outputs.dn-path }}" $AGENT_ARG prep $PLAN_ARG "${{ steps.payload.outputs.issue }}"