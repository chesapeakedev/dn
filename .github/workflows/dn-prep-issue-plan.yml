name: dn prep issue plan

on:
  repository_dispatch:
    types: [dn.prep_issue_plan]

permissions:
  contents: write
  issues: write

jobs:
  prep-issue-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Run dn prep
        uses: chesapeakedev/dn-action@v1
        with:
          workflow: dn.prep_issue_plan
          validate-only: ${{ github.event.client_payload.validate_only == true }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          NO_COLOR: "1"
