# Smoke-test the published dn-action install path (same as consumer workflows).
# Run manually from Actions → "dn-action smoke test".
name: dn-action smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: install and verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Install dn
        id: install
        uses: chesapeakedev/dn-action@v1

      - name: Verify install with coreutils and dn CLI
        shell: bash
        env:
          DN_PATH: ${{ steps.install.outputs.dn-path }}
          DN_VERSION: ${{ steps.install.outputs.dn-version }}
          NO_COLOR: "1"
        run: |
          set -euo pipefail

          check() {
            local name="$1"
            shift
            echo "::group::check: ${name}"
            if "$@"; then
              echo "ok: ${name}"
            else
              echo "::error::failed check: ${name}"
              exit 1
            fi
            echo "::endgroup::"
          }

          echo "Action reported version: ${DN_VERSION}"
          echo "Action reported path:   ${DN_PATH}"
          echo "PATH: ${PATH}"
          echo "Install dir listing:"
          ls -la "$(dirname "${DN_PATH}")" || true

          check "dn-path is set" test -n "${DN_PATH}"
          check "dn-path is a regular file" test -f "${DN_PATH}"
          check "dn-path is executable" test -x "${DN_PATH}"

          check "'dn' is on PATH (command -v dn)" command -v dn
          dn_on_path="$(command -v dn)"
          echo "command -v dn => ${dn_on_path}"

          check "PATH dn is executable" test -x "${dn_on_path}"
          check "PATH dn matches action dn-path" test "${dn_on_path}" = "${DN_PATH}"

          install_dir="$(dirname "${DN_PATH}")"
          check "install directory exists" test -d "${install_dir}"

          if command -v file >/dev/null 2>&1; then
            echo "::group::file ${DN_PATH}"
            file "${DN_PATH}"
            echo "::endgroup::"
          fi

          # Bare 'dn' runs and prints usage (exits 1); confirms the binary is functional.
          check "bare 'dn' prints top-level usage" bash -c '
            set +o pipefail
            usage="$(dn 2>&1 || true)"
            grep -q "dn - A CLI" <<< "${usage}"
          '

          echo "Smoke test passed on ${RUNNER_OS}/${RUNNER_ARCH}"
