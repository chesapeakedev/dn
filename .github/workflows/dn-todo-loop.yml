name: dn todo loop
run-name: "dn.todo_loop · ${{ github.event.client_payload.dispatch_id || github.run_id }}"

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      plan_file:
        description: "Path to the todo plan file"
        required: false
        default: "plans/todo.plan.md"
        type: string
      validate_only:
        description: "Validate configuration without running loop"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [dn.todo_loop]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  todo-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Run dn loop on todo plan
        uses: chesapeakedev/dn-action@v1
        with:
          workflow: dn.todo_loop
          validate-only: ${{ github.event.client_payload.validate_only == true || inputs.validate_only == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DN_TODO_PLAN_PATH: ${{ github.event.client_payload.plan_file || inputs.plan_file || 'plans/todo.plan.md' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          NO_COLOR: "1"
